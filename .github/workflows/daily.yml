name: Daily issue

# Scheduled generation of The Morning Shelf.
#
# Why this runs here and not in Vercel: on the Vercel Hobby plan serverless
# functions cap at 60s, but the Gauntlet pipeline makes 8+ sequential Claude
# calls and needs longer. GitHub Actions has no such cap. Vercel just hosts the
# read-only archive; this workflow does the generation and writes to Neon.
#
# DST-safe timing: GitHub cron is UTC-only, so we bracket 06:00
# America/New_York across EST/EDT with weekday schedules, plus a later backstop.
#
# Minutes are deliberately OFF the top of the hour. GitHub's scheduler is
# best-effort and delays or drops runs most heavily at :00 (its peak-load
# window); scheduling at :13/:41/:37 measurably improves reliability. Observed
# in this repo's run history: at :00 the runs degraded from on-time to ~10h late
# to missed entirely on consecutive days.
#
# There is deliberately NO wall-clock gate ("only run if it's exactly 06:00
# ET") on top of that. Scheduled triggers are not guaranteed to fire on time —
# under load they can be delayed by hours or dropped. An exact-hour-string gate
# does not tolerate that: it just silently skips generation for the whole day.
# Instead we rely entirely on the pipeline's own per-date idempotency (skips if
# today's issue already exists, unless --force) — whichever schedule fires first
# each day generates the issue, at whatever hour it actually runs; the rest
# (including the backstop) become cheap no-ops. See ASSUMPTIONS.md's 2026-08-06
# entry.

on:
  schedule:
    - cron: "13 10 * * 1-5" # ~06:13 America/New_York during EDT
    - cron: "41 11 * * 1-5" # ~06:41 America/New_York during EST
    - cron: "37 12 * * 1-5" # backstop ~2h later if the earlier ticks were dropped
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's issue even if it already exists"
        type: boolean
        default: false

# Never let two runs generate the same day's issue concurrently.
concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Direct Anthropic (preferred — bypasses the Vercel AI Gateway card wall).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Only used if ANTHROPIC_API_KEY is unset (Gateway fallback).
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL_DRAFTER: ${{ secrets.MODEL_DRAFTER || 'claude-sonnet-4-5' }}
      MODEL_CRITIC: ${{ secrets.MODEL_CRITIC || 'claude-sonnet-4-5' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      # Opt-in only, default off. See ASSUMPTIONS.md's 2026-08-06 auto-publish entry.
      AUTO_PUBLISH_ON_HOLD: ${{ secrets.AUTO_PUBLISH_ON_HOLD }}
      PRICE_INPUT_PER_MTOK: ${{ secrets.PRICE_INPUT_PER_MTOK }}
      PRICE_OUTPUT_PER_MTOK: ${{ secrets.PRICE_OUTPUT_PER_MTOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Idempotent; safe to run every time.
      - name: Apply database migrations
        run: npm run migrate

      - name: Generate today's issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run pipeline ${{ inputs.force && '-- --force' || '' }}
          else
            npm run pipeline
          fi
